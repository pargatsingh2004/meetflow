
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>{% block title %}MeetFlow{% endblock %}</title>

    <script src="{% static 'js/theme-init.js' %}"></script>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/style.css' %}?v=3"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/theme.css' %}?v=3"
        rel="stylesheet"
    ><link rel="stylesheet" href="{% static 'css/auth-modern.css' %}?v=3">

    <link href="{% static 'css/typography-contrast.css' %}?v=3" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/meeting.css' %}?v=3">
    
</head>

<body class="{% block bodyclass %}{% endblock %}">

    

    <div id="toastArea" aria-live="polite"></div>

    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{% static 'js/common.js' %}?v=2"></script>
    <script src="{% static 'js/theme.js' %}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
