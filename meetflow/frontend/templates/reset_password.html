
{% extends "base.html" %}
{% load static %}

{% block title %}Reset Password — MeetFlow{% endblock %}

{% block body %}

<div class="auth-container">

    <div class="auth-card">

        <div class="text-center mb-4">

            <a href="/" class="text-decoration-none">
                <h2 class="fw-bold text-dark">
                    <i class="bi bi-camera-video-fill text-primary"></i>
                    MeetFlow
                </h2>
            </a>

            <div class="my-4">
                <i class="bi bi-key-fill text-primary"
                   style="font-size: 48px;"></i>
            </div>

            <h3 class="fw-bold">
                Create New Password
            </h3>

            <p class="text-secondary">
                Enter a new password to secure your account.
            </p>

        </div>

        <form id="resetPasswordForm"><label class="form-label">Email</label><input type="email" name="email" class="form-control mb-3" required><label class="form-label">Six-digit Email OTP</label><input name="otp" class="form-control mb-3" pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code" required>

            <label for="newPassword"
                   class="form-label fw-semibold">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                name="new_password"
                class="form-control form-control-lg mb-3"
                placeholder="Enter new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword"
                   class="form-label fw-semibold">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirm_password"
                class="form-control form-control-lg mb-4"
                placeholder="Confirm new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit"
                    class="btn btn-primary btn-lg w-100">

                <i class="bi bi-check-circle me-2"></i>
                Reset Password

            </button>

            <div class="form-status mt-3"
                 role="status"
                 aria-live="polite"></div>

        </form>

        <div class="text-center mt-4">

            <a href="/login/"
               class="text-decoration-none">

                <i class="bi bi-arrow-left me-1"></i>
                Back to Login

            </a>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
